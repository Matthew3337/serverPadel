# ============================================
# Connessione al database
# ============================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/padel_booking
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# ============================================
# JPA / Hibernate
# ddl-auto=validate -> non modifica lo schema, verifica solo
# che le Entity corrispondano alle tabelle create con gli script SQL
# ============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# Server
# ============================================
server.port=8080

# ============================================
# JWT
# Cambia questa chiave in produzione! Deve essere lunga almeno 256 bit.
# I token non hanno scadenza e sono deterministici: per lo stesso telefono,
# a parità di JWT_SECRET, un nuovo login restituisce lo stesso token.
# ============================================
jwt.secret=${JWT_SECRET}

# ============================================
# Attività pianificate
# Giro delle scadenze delle partite ogni minuto (ScadenzePartiteScheduler).
# false disattiva lo scheduler, per esempio in un ambiente di test.
# Per vedere anche i giri senza modifiche:
# logging.level.com.padelbooking.api.service.ScadenzePartiteService=DEBUG
# ============================================
padel.scadenze.attive=${PADEL_SCADENZE_ATTIVE:true}
