# ============================================
# Connessione al database
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/padel_booking
spring.datasource.username=root
spring.datasource.password=Matteo@2006

# ============================================
# JPA / Hibernate
# ddl-auto=validate -> non modifica lo schema, verifica solo
# che le Entity corrispondano alle tabelle create con gli script SQL
# ============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# Server
# ============================================
server.port=8080

# ============================================
# JWT
# Cambia questa chiave in produzione! Deve essere lunga almeno 256 bit.
# ============================================
jwt.secret=cambiaQuestaChiaveSegretaConUnaMoltoPiuLungaEComplessaInProduzione123456
jwt.expiration-ms=86400000
